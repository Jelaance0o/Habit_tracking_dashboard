<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Productivity Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="main">

      <section class="allElems">
        <div class="todo elem" id="0">
          <img
            src="https://i.pinimg.com/1200x/44/76/bd/4476bdc07db33572955e8718b3f62360.jpg"
            alt=""
          />
          <h2>To Do List</h2>
        </div>
        <div class="daily elem" id="1">
          <img
            src="https://i.pinimg.com/736x/f9/49/9c/f9499c4b39192f285fdc528917b122ef.jpg"
            alt=""
          />
          <h2>Daily Planner</h2>
        </div>
        <div class="moti elem" id="2">
          <img
            src="https://i.pinimg.com/736x/70/fe/55/70fe55f70badb901dec2ad837ee8588d.jpg"
            alt=""
          />
          <h2>Motivation</h2>
        </div>
        <div class="pomo elem" id="3">
          <img
            src="https://i.pinimg.com/736x/81/c2/d5/81c2d5db59757d2ab8f1730dc26a0165.jpg"
            alt=""
          />
          <h2>Pomodoro Timer</h2>
        </div>
        <div class="goals elem" id="4">
          <img
            src="https://i.pinimg.com/736x/46/b2/8d/46b28d267bd74adbd002cf96c4dbe187.jpg"
            alt=""
          />
          <h2>Daily goals</h2>
        </div>
      </section>
                                            
                                              <!-- TO DO List -->

      <section class="fullElem todo-list-fullpage"> 
        <button class="back" id="0"><i class="ri-arrow-left-circle-line"></i></button>
        <h2>Your Personalised Task List</h2>

        <div class="todo-container">
         <div class="addTask">
            <form action="">
              <input id="task-input" type="text" placeholder="Enter Text">
              <textarea placeholder="Enter Detailes" id="" cols="40"></textarea>
              
              <div class="mark-imp">
                <input type="checkbox" name="" id="check">
                <label for="check">Mark as Important</label>
              </div>

              <button>Add Task</button>
            </form>
         </div>
         <div class="allTask">


         </div>
      </section>

     

    </div>
    <script src="script.js"></script>
  </body> 
</html>
